<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <fieldset>
        <legend>BioData</legend>
        <form action="./response.html">
            <label for="name">UserName:</label>
            <input type="text" name="name" id="name" placeholder="Enter your name"><br> <br>

            <label for="Pass">Password:</label>
            <input type="password" name="password" id="Pass" placeholder="Enter your password:"><br> <br>
            
            <label for="DOB">Enter Your Date of Birth</label>
            <input type="date" name="DOB" id="DOB"><br> <br>

            <label for="gender">Gender:</label>
            <input type="radio" name="gender" id="gender">

            <label for="Male">Male</label>
            <input type="radio" name="gender" id="gender">

            <label for="Female">Female</label>
            <input type="radio" name="gender" id="gender"><br> <br>

            <label for="lang">Select Language:</label>
            <select name="lang" id="lang" >
                <option value="C">C</option>
                <option value="C++">C++</option>
                <option value="Java">Java</option>
                <option value="Python">Python</option>
            </select> <br> <br>

            <label for="hobb">Hobbies:</label>
            <input type="checkbox" name="hobb1" id="hobb"><label for="hobb">Cricket</label>
            
            <label for="hobb">Hobbies:</label>
            <input type="checkbox" name="hobb2" id="hobb" ><label for="hobb">FootBall</label><br> <br>

            <label for="Address">Address:</label>
            <textarea name="Address">Address:</textarea> <br> <br>
            
            <label for="tel">Phone:</label>
            <input type="tel" name="tel" id="tel" > <br> <br>

            <label for="email">Email</label>
            <input type="email" name="email" id="email" > <br> <br>

            <label for=""> Attempt:</label>
            <input type="number" name="att" id="att" > <br> <br>

            <label for="url">HomePage: </label>
            <input type="url" name="url" id="url" > <br> <br>
            
            <label for="file">Resume Upload:</label>
            <input type="file" name="file" id="file" > <br> <br>

            <input type="submit" value="submit" >
            <input type="reset" value="reset" >







        </form>
    </fieldset>
    


</body>
